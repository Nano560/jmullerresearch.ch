        /* Ricker wavelet — the same wavelet used in the papers */
        .wavelet {

        .wavelet path {

            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px var(--glow));
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            animation: wavelet-draw 2.2s ease-out forwards,
                       wavelet-cloak 4.5s ease-in-out 2.4s infinite;
        }

        /* Signal sweeps in from silence... */
        @keyframes wavelet-draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* ...then fades toward "cloaked" and back, like a faint echo. */
        @keyframes wavelet-cloak {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .err-title {
            margin-top: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .wavelet path {
                animation: none;
                stroke-dashoffset: 0;
            }
